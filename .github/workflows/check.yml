# The check of a pull request: what tools/check.sh runs for the change, in two jobs that each plan for themselves. The apps run
# on GitHub's runners; the Go suite runs on the founder's own runner (docs/ci-runner.md), whose build and test caches stay on
# its disk between runs, so go test reruns only what a change touched. Python is not checked here: it is being removed.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main] # warms the caches a pull request reads

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secrets in the commits of this change
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_<version>_checksums.txt, linux_x64
        run: |
          # The release binary, pinned and checked: gitleaks-action needs a paid licence for an organisation's repository.
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          # Only what the change adds: BASE..HEAD. A first push to a branch has no base, so it scans the head commit alone.
          case "$BASE" in ""|0000000000000000000000000000000000000000) range="-1 HEAD" ;; *) range="$BASE..HEAD" ;; esac
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .
      - name: Plan
        id: plan
        run: |
          plan="$(CHECK_PLAN=1 tools/check.sh "$BASE")"
          echo "$plan"
          apps="${plan##*apps=}"
          # A push to main runs the apps only when they changed, then all of them, which warms the turbo cache.
          if [ "${{ github.event_name }}" = push ] && [ "$apps" != turbo ]; then apps=no; fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.apps != 'no'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.plan.outputs.apps != 'no'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.plan.outputs.apps != 'no'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.apps != 'no'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Tests, typecheck and lint of the apps
        if: steps.plan.outputs.apps != 'no'
        run: |
          if [ "${{ steps.plan.outputs.apps }}" = turbo ]; then
            pnpm turbo test typecheck lint --continue
          else
            pnpm --dir packages/app-data test
          fi

  go:
    # The runner is the founder's own machine: a pull request from a fork never reaches it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, handline-ci]
    timeout-minutes: 30
    env:
      GOFLAGS: -p=1 # 2 cores and 3 GB of memory: one test binary at a time
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = push ]; then echo "kind=go" >> "$GITHUB_OUTPUT"; exit 0; fi
          plan="$(CHECK_PLAN=1 tools/check.sh "$BASE")"
          echo "$plan"
          kind="${plan%% *}"; kind="${kind#kind=}"
          # A change outside go/ and the apps (python, before) still runs the Go suite: the Python suite is not run in CI.
          case "$kind" in go|python) echo "kind=go" ;; *) echo "kind=$kind" ;; esac >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.kind == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache: false # GOCACHE and GOMODCACHE stay on the runner's disk
      - if: steps.plan.outputs.kind == 'go'
        run: tools/test-go.sh
        env:
          TMPDIR: ${{ runner.temp }} # emptied after every job, and the same path each run, as go test's cache needs
      - name: Go parity tests
        if: steps.plan.outputs.kind == 'go'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          tools/test.sh tests/infra/test_go_schema.py
          tools/test.sh tests/infra/test_go_tidy.py
