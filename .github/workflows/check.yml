# The check of a pull request: what tools/check.sh runs for the change, as parallel jobs that each plan for themselves, all on
# GitHub's runners (docs/ci-runner.md): the apps, the Go suite in shards of packages (tools/go-shard.sh), and the gates that are
# not a package's test. The Go jobs restore setup-go's module and build cache, keyed by go/go.sum.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main] # warms the caches a pull request reads

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secrets in the commits of this change
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_<version>_checksums.txt, linux_x64
        run: |
          # The release binary, pinned and checked: gitleaks-action needs a paid licence for an organisation's repository.
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          # Only what the change adds: BASE..HEAD. A first push to a branch has no base, so it scans the head commit alone.
          case "$BASE" in ""|0000000000000000000000000000000000000000) range="-1 HEAD" ;; *) range="$BASE..HEAD" ;; esac
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .
      - name: Plan
        id: plan
        run: |
          plan="$(CHECK_PLAN=1 tools/check.sh "$BASE")"
          echo "$plan"
          apps="${plan##*apps=}"
          # A push to main runs the apps only when they changed, then all of them, which warms the turbo cache.
          if [ "${{ github.event_name }}" = push ] && [ "$apps" != turbo ]; then apps=no; fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.apps != 'no'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.plan.outputs.apps != 'no'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.plan.outputs.apps != 'no'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.apps != 'no'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: No internal words in the apps' user-visible strings
        if: steps.plan.outputs.apps != 'no'
        run: node tools/ui-copy-check.mjs
      - name: Tests, typecheck and lint of the apps
        if: steps.plan.outputs.apps != 'no'
        run: |
          if [ "${{ steps.plan.outputs.apps }}" = turbo ]; then
            pnpm turbo test typecheck lint --continue
          else
            pnpm --dir packages/app-data test
          fi

  daemon:
    name: daemon (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [compose, cli, daemon, terminal, other]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = push ]; then echo "kind=go" >> "$GITHUB_OUTPUT"; exit 0; fi
          plan="$(CHECK_PLAN=1 tools/check.sh "$BASE")"
          echo "$plan"
          kind="${plan%% *}"; kind="${kind#kind=}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.kind == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - if: steps.plan.outputs.kind == 'go'
        timeout-minutes: 6 # a hung package mirror fails here, not at the job's 30 minutes
        run: tools/ci-tmux.sh # the terminal tests drive a real tmux; git and python3 are on the image
      - if: steps.plan.outputs.kind == 'go'
        # Fails a run that leaves a process, tmux server or temp file behind. Its TMPDIR is <dir>/tmp/: the same path each run,
        # as go test's cache needs, under the runner's temp directory.
        # An empty or failed package list is an error: test-go.sh with no packages would run the whole suite.
        run: |
          pkgs="$(tools/go-shard.sh ${{ matrix.shard }})" && [ -n "$pkgs" ] ||
            { echo "no packages for shard ${{ matrix.shard }}" >&2; exit 1; }
          tools/leakcheck.py run --dir "$RUNNER_TEMP/hlc" tools/test-go.sh $pkgs

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = push ]; then echo "kind=go" >> "$GITHUB_OUTPUT"; exit 0; fi
          plan="$(CHECK_PLAN=1 tools/check.sh "$BASE")"
          echo "$plan"
          kind="${plan%% *}"; kind="${kind#kind=}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.kind == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - if: steps.plan.outputs.kind == 'go'
        timeout-minutes: 6 # a hung package mirror fails here, not at the job's 30 minutes
        run: tools/ci-tmux.sh # the terminal tests drive a real tmux; git and python3 are on the image
      - if: steps.plan.outputs.kind == 'go'
        run: tools/leakcheck.py run --dir "$RUNNER_TEMP/hlc" tools/test-go.sh --gates
      - name: Contract files current
        if: steps.plan.outputs.kind == 'go'
        run: |
          python3 contract/generate.py --check
          python3 tools/go_contract.py --check

  # What a reviewer would otherwise catch by hand in the files the change adds or edits (tools/pr_checks.py files), and Prettier on
  # those of them it formats: a file the change touches is formatted whole.
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest tools/test_pr_checks.py tools/test_merge_ready.py
      - name: Binaries, images, scratch files and long comments
        run: |
          case "$BASE" in ""|0000000000000000000000000000000000000000) exit 0 ;; esac
          python3 tools/pr_checks.py files "$BASE"
      - name: Prettier on the files the change touches
        run: |
          case "$BASE" in ""|0000000000000000000000000000000000000000) exit 0 ;; esac
          git diff --name-only --no-renames --diff-filter=AM "$BASE...HEAD" |
            grep -E '^((packages|apps|web)/.*\.(ts|tsx|js|mjs|json|css)|[^/]*\.json)$' > "$RUNNER_TEMP/pretty" || exit 0
          xargs npx --yes prettier@3.9.9 --check < "$RUNNER_TEMP/pretty"

  # The required check on main: green only when every shard and the contract job passed.
  go:
    needs: [daemon, contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.daemon.result }}" = success && test "${{ needs.contract.result }}" = success

  # The one check an auditor waits for before starting: the apps, the Go suite and the file checks all passed.
  pre-audit:
    needs: [apps, go, files]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.apps.result }}" = success && test "${{ needs.go.result }}" = success && test "${{ needs.files.result }}" = success
