# The check of a pull request: what tools/check.sh runs for the change, in two jobs that each plan for themselves. The apps run
# on GitHub's runners; the Go suite runs on the founder's own runner (docs/ci-runner.md), whose build and test caches stay on
# its disk between runs, so go test reruns only what a change touched. Python is not checked here: it is being removed.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main] # warms the caches a pull request reads

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          # A push to main runs everything: its job is the caches.
          if [ "${{ github.event_name }}" = push ]; then echo "apps=turbo" >> "$GITHUB_OUTPUT"; exit 0; fi
          plan="$(CHECK_PLAN=1 tools/check.sh "$BASE")"
          echo "$plan"
          echo "apps=${plan##*apps=}" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.apps != 'no'
        uses: pnpm/action-setup@v4
      - if: steps.plan.outputs.apps != 'no'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.plan.outputs.apps != 'no'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.apps != 'no'
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Tests, typecheck and lint of the apps
        if: steps.plan.outputs.apps != 'no'
        run: |
          if [ "${{ steps.plan.outputs.apps }}" = turbo ]; then
            pnpm turbo test typecheck lint --continue
          else
            pnpm --dir packages/app-data test
          fi

  go:
    runs-on: [self-hosted, linux, netcup]
    timeout-minutes: 30
    env:
      GOFLAGS: -p=2 # 4 GB of memory: two test binaries at a time
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = push ]; then echo "kind=go" >> "$GITHUB_OUTPUT"; exit 0; fi
          plan="$(CHECK_PLAN=1 tools/check.sh "$BASE")"
          echo "$plan"
          kind="${plan%% *}"; kind="${kind#kind=}"
          # A change outside go/ and the apps (python, before) still runs the Go suite: the Python suite is not run in CI.
          case "$kind" in go|python) echo "kind=go" ;; *) echo "kind=$kind" ;; esac >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.kind == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false # GOCACHE and GOMODCACHE stay on the runner's disk
      - if: steps.plan.outputs.kind == 'go'
        run: tools/test-go.sh
        env:
          TMPDIR: ${{ runner.temp }} # emptied after every job, and the same path each run, as go test's cache needs
      - name: Go parity tests
        if: steps.plan.outputs.kind == 'go'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          tools/test.sh tests/infra/test_go_schema.py
          tools/test.sh tests/infra/test_go_tidy.py
