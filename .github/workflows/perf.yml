# How much the web app draws in everyday scenarios (apps/web/scripts/perf/run.ts), checked against apps/web/perf-budget.json:
# nightly, and on pull requests that change the web app or the packages it draws from. Headless Chrome only.
name: perf

on:
  schedule:
    - cron: '30 18 * * *' # 03:30 KST
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/**'
      - 'packages/app-*/**'
      - 'packages/fake-daemon/**'

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @handline/web perf
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf
          path: apps/web/scripts/perf/out/perf.json
          if-no-files-found: ignore
