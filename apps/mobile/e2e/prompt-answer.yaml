# After pair-and-page.yaml, on a fresh `pnpm fake-listener --prompt` (a permission waits on handline.architect): the card shows in the chat and answers Yes.  maestro test e2e/prompt-answer.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: nav-agents
- tapOn:
    id: agent-handline.architect
- assertVisible:
    id: prompt-card
- assertVisible: '.*git push origin.*'
- tapOn:
    id: answer-1
- assertNotVisible:
    id: prompt-card
