# After pair-and-page.yaml, on a fresh `pnpm fake-listener --picture`, as the founder: Delete in the viewer asks where the photo goes from, Keep it leaves it, Delete removes it and its row reads Photo deleted too.  maestro test e2e/photo-delete.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- tapOn:
    id: picture-(?!d0d0d0d0d0d0d0d0|full).*
- assertVisible:
    id: picture-delete
- takeScreenshot: shots/delete-1-viewer
- tapOn:
    id: picture-delete
- assertVisible:
    id: delete-ask
- assertVisible: ".*It disappears from 1 place.*"
- takeScreenshot: shots/delete-2-ask
- tapOn:
    id: delete-keep
- assertNotVisible:
    id: delete-ask
- tapOn:
    id: picture-delete
- assertVisible: ".*It disappears from 1 place.*"
- tapOn:
    id: delete-yes
- assertNotVisible:
    id: picture-full-.*
- assertVisible: "Photo deleted"
- takeScreenshot: shots/delete-3-deleted
