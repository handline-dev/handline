# Drives the app on the iOS simulator against `pnpm fake-listener`:  maestro test -e URI="$(head -1 listener.log)" e2e/pair-and-page.yaml
appId: dev.handline.mobile
---
# the dev client's floating gear sits over New agent and takes its taps; its UserDefaults key is read from the launch arguments
- launchApp:
    arguments:
      EXDevMenuShowFloatingActionButton: "NO" # NSUserDefaults reads the bool from this string; `false` leaves the gear
# a relaunched dev client starts on its launcher: load the bundle from Metro on this machine
- openLink: exp+handline://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- runFlow:
    when: { visible: 'Open in.*' }
    commands: [{ tapOn: Open }]
# the dev client shows its menu on first launch; close it
- runFlow:
    when: { visible: Continue }
    commands: [{ tapOn: Continue }]
- runFlow:
    when: { visible: Reload }
    commands: [{ tapOn: { point: "90%,48%" } }]
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- runFlow:
    when: { visible: { id: nav-agents } }
    commands: [{ tapOn: { id: nav-agents } }]
- runFlow:
    when: { visible: Unpair this phone }
    commands: [{ tapOn: Unpair this phone }]
- tapOn:
    id: pair-uri
- eraseText: 400
- inputText: ${URI}
- tapOn: Pair with a daemon
- takeScreenshot: shots/1-pair
- tapOn:
    id: pair-go
- assertVisible: Agents
- assertVisible:
    id: agent-handline.architect
- takeScreenshot: shots/2-agent-list
- tapOn:
    id: agent-handline.architect
- assertVisible:
    id: chat-input
- takeScreenshot: shots/3-agent-page-chat
- tapOn:
    id: tab-terminal
- assertVisible:
    id: terminal-text
- takeScreenshot: shots/4-terminal-watch-only
- assertNotVisible:
    id: composer
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-input
