# On the Agents tab of a paired phone, on a fresh `pnpm fake-listener` (re-pair first: pair-and-page.yaml): open an agent's chat, reply to a message, send, see all.  maestro test e2e/chat.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- assertVisible:
    id: chat-input
- assertVisible: 'Use the contract fixtures.*'
- tapOn:
    id: body-101
- assertVisible:
    id: replying
- tapOn:
    id: chat-input
- inputText: About that
- tapOn:
    id: chat-send
- assertVisible: '.*↩ #.*'
- tapOn:
    id: chat-input
- inputText: Phone chat works
- tapOn:
    id: chat-send
- assertVisible: 'Phone chat works.*'
- tapOn:
    id: scope-all
- tapOn:
    id: tab-terminal
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-input
