# After pair-and-page.yaml, on a fresh `pnpm fake-listener`: search an agent's chat, tap a hit to land on its message, then an empty search.  maestro test e2e/chat-search.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- tapOn:
    id: chat-search
- inputText: contract
- assertVisible:
    id: hit-.*
- tapOn:
    id: hit-.*
- assertVisible:
    id: found-.*
- assertNotVisible:
    id: search-results
- tapOn:
    id: chat-search
- inputText: zzzzqqq
- assertVisible:
    id: search-empty
