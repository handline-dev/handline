# A refused write: run against
#   node scripts/fake-listener.ts --latency 2000 --refuse input.take:input_holder:someone else holds the input
# The pending mark shows at once, then goes with the reason; nothing was faked, so nothing changes.
appId: dev.handline.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    when: { visible: Continue }
    commands: [{ tapOn: Continue }]
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- runFlow:
    when: { visible: Unpair this phone }
    commands: [{ tapOn: Unpair this phone }]
- tapOn:
    id: pair-uri
- inputText: ${URI}
- tapOn: Pair with a daemon
- tapOn:
    id: pair-go
- extendedWaitUntil:
    visible:
      id: agent-handline.architect
    timeout: 20000
- tapOn:
    id: agent-handline.architect
- extendedWaitUntil:
    visible:
      id: tab-terminal
    timeout: 20000
- tapOn:
    id: tab-terminal
- extendedWaitUntil:
    visible:
      id: take
    timeout: 20000
- takeScreenshot: shots/refusal-1-before
- tapOn:
    id: take
- assertVisible: "Input: taking…"
- takeScreenshot: shots/refusal-2-pending
- extendedWaitUntil:
    visible: ".*someone else holds the input.*"
    timeout: 15000
- assertNotVisible: "Input: taking…"
- takeScreenshot: shots/refusal-3-refused
