# After pair-and-page.yaml, after prompt-answer.yaml on the same `pnpm fake-listener --prompt` (the answer is recorded as an event): the Timeline tab of handline.architect lists it, and Chat comes back.  maestro test e2e/agent-timeline.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- tapOn:
    id: tab-timeline
- assertVisible:
    id: timeline
- assertVisible:
    id: timeline-[0-9]+
- assertNotVisible:
    id: chat-input
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-input
