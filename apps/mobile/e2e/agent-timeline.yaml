# After pair-and-page.yaml, on a `pnpm fake-listener` that has been running a few seconds (its autoplay records events): the Timeline tab of an agent page lists them, and Chat comes back.  maestro test e2e/agent-timeline.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- tapOn:
    id: tab-timeline
- assertVisible:
    id: timeline
- assertVisible:
    id: timeline-.*
- assertNotVisible:
    id: chat-input
- tapOn:
    id: tab-chat
- assertVisible:
    id: chat-input
