# A refused read: run against `node scripts/fake-listener.ts --refuse agents.list:state:the daemon is resting`.
appId: dev.handline.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    when: { visible: Continue }
    commands: [{ tapOn: Continue }]
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- runFlow:
    when: { visible: Unpair this phone }
    commands: [{ tapOn: Unpair this phone }]
- tapOn:
    id: pair-uri
- inputText: ${URI}
- tapOn: Pair with a daemon
- tapOn:
    id: pair-go
- extendedWaitUntil:
    visible:
      id: error
    timeout: 15000
- assertVisible: the daemon is resting
- assertVisible: Retry
- takeScreenshot: shots/error-1-refused-read
