# After pair-and-page.yaml: ask a task from the phone, mark it done, reopen it, edit it, discard it, look in Closed.  maestro test e2e/task-verbs.yaml
appId: dev.handline.mobile
---
- tapOn:
    id: nav-tasks
- tapOn:
    id: new-task-open
- tapOn:
    id: nt-owner-handline.architect
- tapOn:
    id: nt-title
- inputText: Try the phone verbs
- tapOn:
    id: nt-send
- assertVisible: 'Try the phone verbs.*'
- tapOn: 'Try the phone verbs.*'
- tapOn:
    id: verb-done
- tapOn:
    id: sheet-text
- inputText: shipped
- tapOn:
    id: sheet-submit
- assertVisible:
    id: verb-reopen
- tapOn:
    id: verb-reopen
- tapOn:
    id: sheet-text
- inputText: one more thing
- tapOn:
    id: sheet-submit
- assertVisible:
    id: verb-cancel
- tapOn:
    id: verb-edit
- takeScreenshot: shots/ios/11-edit-task
- tapOn:
    id: et-priority-1
- tapOn:
    id: sheet-submit
- assertNotVisible:
    id: sheet
- tapOn:
    id: verb-discard
- tapOn:
    id: sheet-text
- inputText: not needed
- tapOn:
    id: sheet-submit
- tapOn:
    id: task-back
- assertVisible: Tasks
- takeScreenshot: shots/ios/12-task-filters
- tapOn:
    id: scope-closed
- assertVisible: 'Try the phone verbs.*'
- takeScreenshot: shots/ios/13-tasks-closed
- tapOn:
    id: scope-open
