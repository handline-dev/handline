# After pair-and-page.yaml, on a fresh `pnpm fake-listener --reply-commands`: two command cards on handline.architect's own reply. Run asks first and runs
# through the daemon, the line under the card says how it went, a risky command says why.
# maestro test e2e/reply-commands.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- assertVisible:
    id: command-0
- takeScreenshot: shots/reply-1-cards
- tapOn:
    id: command-run-0
- assertVisible: '.*It runs there as you.*'
- takeScreenshot: shots/reply-2-confirm
- tapOn:
    id: command-go-0
- assertVisible: '.*Done · exit 0.*'
- takeScreenshot: shots/reply-3-done
- tapOn:
    id: command-run-1
- assertVisible:
    id: command-risk-1
- takeScreenshot: shots/reply-4-risky
- tapOn:
    id: command-cancel-1
