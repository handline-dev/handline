# The File and Preview tabs of an agent's page, against `pnpm fake-listener`:  maestro test -e URI="<the link>" e2e/agent-file-preview.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: Unpair this phone }
    commands: [{ tapOn: Unpair this phone }]
- runFlow:
    when: { visible: { id: pair-uri } }
    commands:
      - tapOn: { id: pair-uri }
      - eraseText: 400
      - inputText: ${URI}
      - tapOn: Connect to your computer
      - tapOn: { id: pair-go }
- tapOn: { id: 'agent-handline.architect' }
- tapOn: { id: tab-file }
- tapOn: { id: file-path }
- inputText: docs/pc-app-gaps.md
- tapOn: { id: file-open }
- assertVisible: the File tab
- hideKeyboard
- takeScreenshot: agent-file-tab
- tapOn: { id: tab-preview }
- tapOn: { id: preview-address }
- inputText: example.com
- tapOn: { id: preview-go }
- extendedWaitUntil: { visible: Example Domain, timeout: 20000 }
- takeScreenshot: agent-preview-tab
