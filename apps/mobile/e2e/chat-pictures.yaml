# After pair-and-page.yaml, on a fresh `pnpm fake-listener --picture`: the picture of a message shows as a thumbnail, a tap opens it full screen, Close shuts it.  maestro test e2e/chat-pictures.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- assertVisible:
    id: pictures
- tapOn:
    id: picture-.*
- assertVisible:
    id: picture-full-.*
- tapOn:
    id: picture-close
- assertNotVisible:
    id: picture-full-.*
- assertVisible:
    id: pictures
