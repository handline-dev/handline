# After pair-and-page.yaml, on a fresh `pnpm fake-listener`: the strip under an agent page's header shows the model, account, context and cache.  maestro test e2e/agent-strip.yaml
appId: dev.handline.mobile
---
- runFlow:
    when: { visible: { id: back } }
    commands: [{ tapOn: { id: back } }]
- tapOn:
    id: agent-handline.architect
- assertVisible:
    id: agent-strip
- assertVisible:
    id: strip-model
- assertVisible:
    id: strip-context
- assertVisible:
    id: strip-cache
