# After pair-and-page.yaml (the phone is paired): the Requests and Tasks tabs against `pnpm fake-listener`.  maestro test e2e/inbox-tasks.yaml
appId: dev.handline.mobile
---
- tapOn:
    id: nav-requests
- assertVisible:
    id: request-group-.*
- tapOn:
    id: 'request-(item|task|agent|machine):.*'
- assertVisible:
    id: request-answers
- tapOn:
    id: request-back
- tapOn:
    id: nav-tasks
- assertVisible: Tasks
- tapOn:
    id: task-.*
- assertVisible:
    id: task-detail
- tapOn:
    id: task-back
- assertVisible: Tasks
